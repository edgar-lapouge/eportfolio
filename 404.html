<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable – Edgar Lapouge</title>
<meta name="robots" content="noindex">
<style>
:root{--s:#1F4D3A;--o:#B85A22;--f:#F6F8F5;--t:#1C2420}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--f);color:var(--t);font:16px/1.6 "Helvetica Neue",Arial,sans-serif;padding:24px}
main{max-width:520px;text-align:center}
.code{font-weight:900;font-size:4rem;color:var(--s);margin:0;line-height:1}
h1{font-size:1.5rem;color:var(--s);margin:12px 0}
a{display:inline-block;margin-top:16px;background:var(--s);color:#fff;text-decoration:none;font-weight:700;border-radius:99px;padding:12px 26px}
a:hover{filter:brightness(1.15)}
a:focus-visible{outline:3px solid var(--o);outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">404</p>
<h1>Cette page n’existe pas</h1>
<p>L’adresse est peut-être mal saisie, ou la page a été déplacée.<br><span lang="en">This page does not exist.</span></p>
<a id="home" href="/">Revenir à l’accueil du portfolio</a>
</main>
<script>
/* GitHub Pages affiche cette page à n'importe quelle profondeur d'URL.
   On cherche l'accueil du portfolio : d'abord /NOM-DU-DEPOT/ (site de dépôt), sinon / (site utilisateur). */
(function(){var p=location.pathname.split("/").filter(Boolean),a=document.getElementById("home");a.href="/";
if(!p.length||!window.fetch)return;var c="/"+p[0]+"/";
fetch(c+"index.html",{method:"HEAD"}).then(function(r){if(r.ok)a.href=c}).catch(function(){});})();
</script>
</body>
</html>
